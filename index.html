<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- يطبّق الوضع الفاتح فوراً (قبل تحميل React) لواجهة الموظفين حتى تظهر شاشة البداية بلون الثيم الصحيح، لا الأسود. -->
    <script>
      (function () {
        if (location.pathname.indexOf('/portal') === 0) return;
        document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
    <!-- إبطال أي service worker/كاش قديم من نسخ سابقة حتى لا يعلق أحد بنسخة مخزّنة قديمة.
         يُلغي التسجيل + يمسح الكاش، ثم يحدّث الصفحة مرة واحدة (حارس sessionStorage ضد التكرار). -->
    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var had = regs && regs.length;
            return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
              if (window.caches && caches.keys) {
                return caches.keys()
                  .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
                  .then(function () { return had; });
              }
              return had;
            });
          }).then(function (had) {
            if (had && !sessionStorage.getItem('sw_purged')) {
              sessionStorage.setItem('sw_purged', '1');
              location.reload();
            }
          }).catch(function () {});
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تأشيرة البناء" />
    <meta name="application-name" content="تأشيرة البناء والإنشاء" />
    <!-- لون شريط الحالة في الجوال = لون ترويسة البرنامج (الوضع الفاتح مفروض على واجهة الموظفين) -->
    <meta name="theme-color" content="#e2dac6" />
    <meta name="msapplication-TileColor" content="#171717" />
    <meta name="msapplication-navbutton-color" content="#171717" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    
    <!-- iOS Splash Screen -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />
    
    <title>تأشيرة البناء والإنشاء | Visa Albina & Alinsha</title>
    
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
      }
      body {
        background: #171717;
      }
      /* البرنامج (واجهة الموظفين) يفرض الوضع الفاتح — نطبّقه على الخلفية منذ أول إطار
         حتى تظهر شاشة البداية (Splash) بلون الثيم الفاتح لا الأسود. (البوابة /portal تبقى كما هي.) */
      html[data-theme="light"] body {
        background: #f2ece0;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      @supports (padding: env(safe-area-inset-top)) {
        body {
          padding: 0;
        }
      }
      /* black-translucent forces white status-bar text; a soft shade keeps it readable on the light theme */
      .pwa-standalone:not(.ios-gap) body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 0px);
        background: linear-gradient(rgba(60, 45, 15, .42), rgba(60, 45, 15, .18));
        z-index: 10000;
        pointer-events: none;
      }
      * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
      }
      input, textarea, select, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* ═══ Dark theme: dropdowns, dates, inputs ═══ */
      select, input[type="date"], input[type="time"], input[type="datetime-local"], input[type="month"], input[type="week"] {
        color-scheme: dark;
      }
      select {
        background-color: rgba(255,255,255,.04) !important;
        color: rgba(255,255,255,.85) !important;
      }
      select option {
        background: #1e1e1e;
        color: rgba(255,255,255,.85);
        padding: 8px 12px;
      }
      input, textarea, select {
        border: 1px solid transparent !important;
        transition: border-color .18s;
      }
      select:focus, input:focus, textarea:focus {
        outline: none;
      }
      /* Search boxes (placeholder starting with "ابحث") keep only the gold
         icon state while focused / holding input — no gold border or inner
         shadow. The :has() rule pulls the preceding search icon into gold. */
      div:has(> input[placeholder^="ابحث"]:focus:not(.occ-sel-search)) > svg,
      div:has(> input[placeholder^="ابحث"]:not(:placeholder-shown):not(.occ-sel-search)) > svg {
        stroke: #D4A017 !important;
        color: #D4A017 !important;
      }
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="time"]::-webkit-calendar-picker-indicator,
      input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        filter: invert(0.7) sepia(1) saturate(3) hue-rotate(15deg);
        cursor: pointer;
        opacity: 0.6;
      }
      input[type="date"]::-webkit-calendar-picker-indicator:hover,
      input[type="time"]::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
      }
      /* Scrollbar for dropdowns */
      select::-webkit-scrollbar { width: 6px; }
      select::-webkit-scrollbar-track { background: #1e1e1e; }
      select::-webkit-scrollbar-thumb { background: rgba(201,168,76,.3); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('pwa-standalone');
        /* iOS bug: with status-bar-style "default" + viewport-fit=cover the app is one
           status-bar height shorter than the screen, leaving a strip at the bottom. */
        var checkGap = function () {
          var portrait = window.innerHeight > window.innerWidth;
          var gap = screen.height - window.innerHeight;
          document.documentElement.classList.toggle('ios-gap', portrait && gap > 20);
        };
        checkGap();
        window.addEventListener('resize', checkGap);
        window.addEventListener('orientationchange', function () { setTimeout(checkGap, 300); });
      }
      /* iOS: when a tap fires a mouseover that changes the page (React hover state),
         Safari swallows the click and the user has to tap twice. Hide the emulated
         hover events that follow a touch so the first tap always clicks. */
      (function () {
        var lastTouch = 0;
        document.addEventListener('touchstart', function () { lastTouch = Date.now(); }, { capture: true, passive: true });
        ['mouseover', 'mouseout', 'mouseenter', 'mouseleave'].forEach(function (t) {
          window.addEventListener(t, function (e) {
            if (Date.now() - lastTouch < 1000) e.stopImmediatePropagation();
          }, true);
        });
      })();
      document.addEventListener('touchmove', function(e) {
        if (e.target.closest('.dash-content, .dash-side, [style*="overflowY"], [style*="overflow-y"]')) return;
        if (e.touches.length > 1) return;
      }, { passive: true });
    </script>
  </body>
</html>
